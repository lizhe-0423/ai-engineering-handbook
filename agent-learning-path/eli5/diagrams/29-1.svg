<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">身份、权限和 Guardrail 怎样约束 Agent · 扩大目标范围</title><desc id="desc">模型把参数改成其他人的任务，即使格式正确，资源授权仍应拒绝。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="61" y="88" width="358" height="340" rx="3" fill="#e5e5dc" stroke="none" stroke-width="1.5" opacity="1"/><rect x="54" y="80" width="358" height="340" rx="3" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="54" y="80" width="5" height="340" rx="0" fill="#685e52" stroke="none" stroke-width="1.5" opacity="1"/><text x="76" y="119" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">委托凭证 · 示意</text><path d="M76,137 L390,137" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="171" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">身份  当前用户</text><text x="76" y="206" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">动作  读取任务</text><text x="76" y="241" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">资源  自己的项目</text><text x="76" y="276" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">期限  当前任务</text><rect x="499" y="80" width="445" height="340" rx="6" fill="#e5e8df" stroke="none" stroke-width="1.5" opacity="1"/><text x="530" y="126" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="650" text-anchor="start">业务服务的资源检查</text><circle cx="544" cy="181" r="12" fill="#287260" stroke="none" stroke-width="2"/><text x="575" y="189" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">可信身份</text><circle cx="544" cy="238" r="12" fill="#287260" stroke="none" stroke-width="2"/><text x="575" y="246" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">动作范围</text><circle cx="544" cy="295" r="12" fill="#bc492e" stroke="none" stroke-width="2"/><text x="575" y="303" fill="#bc492e" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">资源归属  不匹配</text><circle cx="544" cy="352" r="12" fill="#287260" stroke="none" stroke-width="2"/><text x="575" y="360" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">当前授权</text><path d="M427,250 L483,250" fill="none" stroke="#bc492e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">模型参数不能自证身份；每次执行都使用可信授权与当前资源状态。</text></svg>
