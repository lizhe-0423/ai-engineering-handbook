<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Agent 在哪里运行 · 只有代码</title><desc id="desc">仓库已经拉取，但缺运行时、依赖或配置。Agent 无法从源码猜出不存在的真实环境。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="45" y="57" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="650" text-anchor="start">让项目能运行</text><text x="775" y="57" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="650" text-anchor="start">让影响有边界</text><rect x="100" y="324" width="795" height="105" rx="5" fill="#e4e8df" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="100" y="324" width="8" height="105" rx="0" fill="#d8dcd5" stroke="none" stroke-width="1.5" opacity="1"/><text x="131" y="385.5" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600" text-anchor="start">隔离与资源边界</text><text x="868" y="384.5" fill="#bc492e" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="end">缺失</text><rect x="155" y="225" width="685" height="89" rx="5" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="155" y="225" width="8" height="89" rx="0" fill="#d8dcd5" stroke="none" stroke-width="1.5" opacity="1"/><text x="186" y="278.5" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600" text-anchor="start">运行时 · 依赖 · 测试替身</text><text x="813" y="277.5" fill="#bc492e" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="end">缺失</text><rect x="211" y="135" width="574" height="80" rx="5" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="211" y="135" width="8" height="80" rx="0" fill="#685e52" stroke="none" stroke-width="1.5" opacity="1"/><text x="242" y="184.0" fill="#685e52" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600" text-anchor="start">仓库与本次任务文件</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">环境定义可以复用；每次任务的临时状态、进程和凭证需要回收。</text></svg>
