emFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="650" text-anchor="middle">查询</text><circle cx="690" cy="255" r="42" fill="#f6f3eb" stroke="#d8dcd5" stroke-width="2"/><text x="690" y="262" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="650" text-anchor="middle">草稿</text><circle cx="900" cy="255" r="42" fill="#f6f3eb" stroke="#d8dcd5" stroke-width="2"/><text x="900" y="262" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="650" text-anchor="middle">交付</text><circle cx="290" cy="100" r="42" fill="#f6f3eb" stroke="#d8dcd5" stroke-width="2"/><text x="290" y="107" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="650" text-anchor="middle">等待</text><circle cx="690" cy="410" r="42" fill="#6f52aa" stroke="#6f52aa" stroke-width="2"/><text x="690" y="417" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="650" text-anchor="middle">修订</text><text x="45" y="43" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="650" text-anchor="start">任务状态地图</text><text x="472" y="111" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">信息补齐后返回</text><text x="724" y="381" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start">检查未通过</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">一个位置表示一种状态；只有条件满足，才允许沿边进入下一步。</text></svg>
