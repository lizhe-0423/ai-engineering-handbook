<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Agent 服务怎样防止能力被批量提取 · 跨会话拼接</title><desc id="desc">多个请求持续索取相邻片段。结合账号、资源与时间窗口的行为信号识别异常，避免只盯一句话。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="45" y="62" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="650" text-anchor="start">按时间看一串请求</text><circle cx="90" cy="160" r="31" fill="#b44432" stroke="none" stroke-width="2"/><text x="90" y="166" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">1</text><path d="M124,160 L186,233" fill="none" stroke="#b44432" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="300" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle">片段 A</text><circle cx="220" cy="233" r="31" fill="#b44432" stroke="none" stroke-width="2"/><text x="220" y="239" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">2</text><path d="M254,233 L316,160" fill="none" stroke="#b44432" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="300" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle">片段 B</text><circle cx="350" cy="160" r="31" fill="#b44432" stroke="none" stroke-width="2"/><text x="350" y="166" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">3</text><path d="M384,160 L446,233" fill="none" stroke="#b44432" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="300" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle">片段 C</text><circle cx="480" cy="233" r="31" fill="#b44432" stroke="none" stroke-width="2"/><text x="480" y="239" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">4</text><path d="M514,233 L576,160" fill="none" stroke="#b44432" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="300" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle">片段 D</text><circle cx="610" cy="160" r="31" fill="#b44432" stroke="none" stroke-width="2"/><text x="610" y="166" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">5</text><path d="M644,160 L706,233" fill="none" stroke="#b44432" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="300" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle">片段 E</text><circle cx="740" cy="233" r="31" fill="#b44432" stroke="none" stroke-width="2"/><text x="740" y="239" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">6</text><text x="740" y="300" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle">片段 F</text><path d="M88,328 V348 H745 V328" fill="none" stroke="#bc492e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="395" fill="#bc492e" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="650" text-anchor="middle">拼接后可能覆盖完整内容</text><rect x="835" y="110" width="115" height="310" rx="6" fill="#e9dfd5" stroke="none" stroke-width="1.5" opacity="1"/><text x="892" y="180" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">验证</text><text x="892" y="262" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">限流</text><text x="892" y="344" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">复核</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">综合行为信号，分级处理；正常请求也必须进入评测，检查误伤。</text></svg>
