<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">受控运行时怎样管理回合与执行步骤 · 用户取消</title><desc id="desc">停止启动新步骤，对已发出的远程调用请求取消或核对结果。不能仅凭本地停止就宣称外部也已停止。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#18272e" stroke="none" stroke-width="1.5" opacity="1"/><text x="45" y="60" fill="#bdd3e2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="600" text-anchor="start">TURN 01</text><text x="225" y="59" fill="#f4f2e9" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">回答任务为什么受阻</text><rect x="45" y="100" width="590" height="313" rx="4" fill="#243a43" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="80" cy="137" r="10" fill="#287260" stroke="none" stroke-width="2"/><text x="112" y="145" fill="#f4f2e9" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">模型 · 选择查询</text><circle cx="80" cy="195" r="10" fill="#287260" stroke="none" stroke-width="2"/><text x="112" y="203" fill="#f4f2e9" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">工具 1 · 查询任务状态</text><circle cx="80" cy="253" r="10" fill="#287260" stroke="none" stroke-width="2"/><text x="112" y="261" fill="#f4f2e9" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">模型 · 判断缺少原因</text><circle cx="80" cy="311" r="10" fill="#b67e21" stroke="none" stroke-width="2"/><text x="112" y="319" fill="#f4f2e9" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">工具 2 · 查询阻塞记录</text><circle cx="80" cy="369" r="10" fill="#bc492e" stroke="none" stroke-width="2"/><text x="112" y="377" fill="#f4f2e9" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">取消 · 停止启动新步骤</text><text x="700" y="140" fill="#acb9bb" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">工具调用预算</text><rect x="704" y="175" width="59" height="95" rx="3" fill="#94b6a7" stroke="none" stroke-width="1.5" opacity="1"/><rect x="780" y="175" width="59" height="95" rx="3" fill="#94b6a7" stroke="none" stroke-width="1.5" opacity="1"/><rect x="856" y="175" width="59" height="95" rx="3" fill="#405158" stroke="none" stroke-width="1.5" opacity="1"/><text x="811" y="323" fill="#f4f2e9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="43" font-weight="600" text-anchor="middle">2 / 3</text><rect x="684" y="363" width="240" height="34" rx="17" fill="#bc492e" stroke="none" stroke-width="1.5" opacity="1"/><text x="804.0" y="386" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" text-anchor="middle">用户已取消</text><path d="M42,482 L958,482" fill="none" stroke="#405158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#acb9bb" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">示意上限为三次工具调用，重试计入预算；上限由程序执行。</text></svg>
