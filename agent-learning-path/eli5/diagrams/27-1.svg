idth="1.5" opacity="1"/><text x="698" y="139" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle">周四</text><text x="698" y="199" fill="#202b32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="43" font-weight="650" text-anchor="middle">15</text><rect x="802" y="102" width="168" height="132" rx="5" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><text x="886" y="139" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle">周五</text><text x="886" y="199" fill="#202b32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="43" font-weight="650" text-anchor="middle">16</text><path d="M133,249 L133,307" fill="none" stroke="#596b35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="52" y="326" width="340" height="100" rx="5" fill="#e4e9db" stroke="none" stroke-width="1.5" opacity="1"/><text x="76" y="364" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="start">计划 S1 / 本次触发时点</text><text x="76" y="402" fill="#596b35" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">稳定的运行身份</text><path d="M408,376 L549,376" fill="none" stroke="#bc492e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M218,249 V290 H463 V351" fill="none" stroke="#bc492e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 8"/><text x="375" y="280" fill="#bc492e" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle">重复提醒</text><rect x="582" y="296" width="375" height="150" rx="3" fill="#e5e5dc" stroke="none" stroke-width="1.5" opacity="1"/><rect x="575" y="288" width="375" height="150" rx="3" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="575" y="288" width="5" height="150" rx="0" fill="#596b35" stroke="none" stroke-width="1.5" opacity="1"/><text x="597" y="327" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">同一次运行，去重</text><path d="M597,345 L928,345" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="597" y="379" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">随后跟踪执行与交付状态</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">日期与时点仅为示意；错过触发、重叠和取消都需要明确规则。</text></svg>
