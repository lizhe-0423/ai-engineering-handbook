YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start">发送请求已发出</text><path d="M48,378 L440,378" fill="none" stroke="#405158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M466,248 L620,248" fill="none" stroke="#9dc2ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="545" y="215" fill="#9dc2ad" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle">只计算状态</text><rect x="658" y="110" width="300" height="300" rx="3" fill="#122028" stroke="none" stroke-width="1.5" opacity="1"/><rect x="651" y="102" width="300" height="300" rx="3" fill="#263941" stroke="#405158" stroke-width="1.5" opacity="1"/><rect x="651" y="102" width="5" height="300" rx="0" fill="#316979" stroke="none" stroke-width="1.5" opacity="1"/><text x="673" y="141" fill="#f4f2e9" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">恢复出的当前状态</text><path d="M673,159 L929,159" fill="none" stroke="#405158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="673" y="193" fill="#acb9bb" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">草稿存在</text><text x="673" y="228" fill="#acb9bb" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">查询证据已保存</text><text x="673" y="263" fill="#acb9bb" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">发送结果  待核对</text><path d="M42,482 L958,482" fill="none" stroke="#405158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#acb9bb" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">重放记录 ≠ 再执行历史动作。缺回执时，不要凭日志猜成功或失败。</text></svg>
