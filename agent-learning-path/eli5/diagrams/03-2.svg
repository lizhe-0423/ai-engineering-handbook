<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Function Calling 怎样完成一次工具调用 · 权限不通过</title><desc id="desc">参数格式正确，但用户无权访问该任务。应用拒绝调用，并把拒绝状态交回，不能编造任务信息。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="150" y="62" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="650" text-anchor="middle">模型</text><path d="M150,90 L150,435" fill="none" stroke="#cbd1cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><text x="500" y="62" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="650" text-anchor="middle">应用</text><path d="M500,90 L500,435" fill="none" stroke="#cbd1cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><text x="850" y="62" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="650" text-anchor="middle">业务工具</text><path d="M850,90 L850,435" fill="none" stroke="#cbd1cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><path d="M150,146 L485,146" fill="none" stroke="#2858ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="325" y="128" fill="#2858ce" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">调用提议 + 参数</text><rect x="408" y="181" width="184" height="52" rx="3" fill="#bc492e" stroke="none" stroke-width="1.5" opacity="1"/><text x="500" y="214" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" text-anchor="middle">权限拒绝</text><path d="M500,310 L165,310" fill="none" stroke="#bc492e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="325" y="291" fill="#bc492e" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">返回拒绝状态</text><text x="850" y="340" fill="#bc492e" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="600" text-anchor="middle">未调用</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">模型提议 → 应用校验 → 工具执行 → 结果回填，各有自己的责任。</text></svg>
