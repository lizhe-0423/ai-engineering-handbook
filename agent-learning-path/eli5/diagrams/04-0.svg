<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">ReAct 怎样根据观察结果继续行动 · 只拿到状态</title><desc id="desc">查到任务受阻，原因仍未知。下一步查阻塞记录，与当前目标有关。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><path d="M310,145 Q500,15 690,145" fill="none" stroke="#bc492e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M750,220 Q810,390 550,407" fill="none" stroke="#bc492e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M425,407 Q185,370 247,220" fill="none" stroke="#bc492e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="275" cy="180" r="60" fill="#bc492e" stroke="#bc492e" stroke-width="2"/><text x="275" y="187" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="650" text-anchor="middle">判断</text><circle cx="730" cy="180" r="60" fill="#bc492e" stroke="#bc492e" stroke-width="2"/><text x="730" y="187" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="650" text-anchor="middle">行动</text><circle cx="490" cy="405" r="60" fill="#f6f3eb" stroke="#d8dcd5" stroke-width="2"/><text x="490" y="412" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="650" text-anchor="middle">观察</text><text x="500" y="155" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle">查任务状态</text><text x="500" y="217" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" text-anchor="middle">受阻，原因未知</text><rect x="378" y="249" width="244" height="34" rx="17" fill="#bc492e" stroke="none" stroke-width="1.5" opacity="1"/><text x="500.0" y="272" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" text-anchor="middle">再查阻塞记录</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">每次继续都应有新理由；回答、澄清和停止都是合法出口。</text></svg>
