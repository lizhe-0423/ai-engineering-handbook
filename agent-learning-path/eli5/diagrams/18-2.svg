<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">澄清提问怎样挂起并恢复任务 · 旧答复到达</title><desc id="desc">用户已取消或问题已被替换，旧回复不能重新推动任务。重复回复也不能让查询执行两次。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="57" y="66" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">用户</text><text x="405" y="66" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">对话</text><text x="783" y="66" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">任务状态</text><rect x="55" y="100" width="430" height="75" rx="20" fill="#e3ebdf" stroke="none" stroke-width="1.5" opacity="1"/><text x="80" y="146" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="400" text-anchor="start">帮我写一份周报</text><rect x="151" y="204" width="438" height="75" rx="20" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><text x="178" y="251" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" text-anchor="start">需要哪一周的日期范围？</text><path d="M612,240 L702,240" fill="none" stroke="#b44432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="732" y="130" width="230" height="285" rx="3" fill="#e5e5dc" stroke="none" stroke-width="1.5" opacity="1"/><rect x="725" y="122" width="230" height="285" rx="3" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="725" y="122" width="5" height="285" rx="0" fill="#b44432" stroke="none" stroke-width="1.5" opacity="1"/><text x="747" y="161" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">保存书签</text><path d="M747,179 L933,179" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="747" y="213" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">任务 T-01</text><text x="747" y="248" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">问题 Q-01</text><text x="747" y="283" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">任务已取消</text><text x="747" y="318" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">不再恢复执行</text><rect x="55" y="315" width="430" height="75" rx="20" fill="#e3ebdf" stroke="none" stroke-width="1.5" opacity="1"/><text x="80" y="361" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" text-anchor="start">本周一到周五</text><rect x="110" y="416" width="350" height="34" rx="17" fill="#bc492e" stroke="none" stroke-width="1.5" opacity="1"/><text x="285.0" y="439" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" text-anchor="middle">任务已取消，忽略旧回复</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">回答要关联当前问题；重复、迟到和无效答复不能随意推进状态。</text></svg>
