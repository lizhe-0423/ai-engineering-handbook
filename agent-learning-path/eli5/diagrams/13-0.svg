<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">多 Agent 怎样分工并交付共同结果 · 分工明确</title><desc id="desc">查询者交付事实与来源，写作者交付草稿，审查者检查结论。每次交接都有明确产物。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="48" y="112" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">查询 Agent</text><path d="M220,149 L950,149" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="242" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">写作 Agent</text><path d="M220,279 L950,279" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="372" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">审查 Agent</text><path d="M220,409 L950,409" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="245" y="75" width="195" height="65" rx="4" fill="#dbe8f7" stroke="none" stroke-width="1.5" opacity="1"/><text x="342" y="115" fill="#2858ce" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" text-anchor="middle">事实 + 来源</text><path d="M440,108 H488 V237 H545" fill="none" stroke="#2858ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="550" y="205" width="185" height="65" rx="4" fill="#e7e0f2" stroke="none" stroke-width="1.5" opacity="1"/><text x="642" y="245" fill="#6f52aa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" text-anchor="middle">周报草稿</text><path d="M735,237 H775 V368 H815" fill="none" stroke="#6f52aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="820" y="335" width="130" height="65" rx="4" fill="#e2eddf" stroke="none" stroke-width="1.5" opacity="1"/><text x="885" y="375" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" text-anchor="middle">验收</text><text x="308" y="447" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" text-anchor="start">每次交接都带范围、产物与证据</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">角色增加了交接；共同结果仍要统一验收。</text></svg>
