e="#287260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="650" y="155" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle">按需取用</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">正式任务状态另外保存；聊天摘要不负责证明某次发送是否成功。</text></svg>
