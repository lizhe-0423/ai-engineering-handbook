<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Function Calling 怎样完成一次工具调用 · 执行并回填</title><desc id="desc">应用校验参数和权限，再查询业务服务。结果带着对应调用标识回填，模型据此组织回答。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="150" y="62" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="650" text-anchor="middle">模型</text><path d="M150,90 L150,435" fill="none" stroke="#cbd1cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><text x="500" y="62" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="650" text-anchor="middle">应用</text><path d="M500,90 L500,435" fill="none" stroke="#cbd1cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><text x="850" y="62" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="650" text-anchor="middle">业务工具</text><path d="M850,90 L850,435" fill="none" stroke="#cbd1cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><path d="M150,146 L485,146" fill="none" stroke="#2858ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="325" y="128" fill="#2858ce" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">调用提议 + 参数</text><rect x="408" y="181" width="184" height="52" rx="3" fill="#e5eee8" stroke="none" stroke-width="1.5" opacity="1"/><text x="500" y="214" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" text-anchor="middle">参数与权限校验</text><path d="M500,265 L835,265" fill="none" stroke="#287260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="675" y="248" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">真正执行查询</text><path d="M850,337 L515,337" fill="none" stroke="#287260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="675" y="319" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">任务状态 · 受阻</text><path d="M500,409 L165,409" fill="none" stroke="#2858ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="325" y="391" fill="#2858ce" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">对应调用标识的结果</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">模型提议 → 应用校验 → 工具执行 → 结果回填，各有自己的责任。</text></svg>
