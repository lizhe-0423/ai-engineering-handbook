<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">意图识别怎样进入请求路由 · 明确查询</title><desc id="desc">请求带着任务编号，意图是查询状态，参数也齐全。可以进入只读查询分支。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="52" y="188" width="275" height="180" rx="3" fill="#e5e5dc" stroke="none" stroke-width="1.5" opacity="1"/><rect x="45" y="180" width="275" height="180" rx="3" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="45" y="180" width="5" height="180" rx="0" fill="#6f52aa" stroke="none" stroke-width="1.5" opacity="1"/><text x="67" y="219" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">用户请求</text><path d="M67,237 L298,237" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="67" y="271" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">查任务状态</text><text x="67" y="306" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">有明确任务编号</text><path d="M330,266 L455,266" fill="none" stroke="#6f52aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="495" cy="266" r="30" fill="#6f52aa" stroke="none" stroke-width="2"/><path d="M525,266 C660,266 650,107 762,107" fill="none" stroke="#6f52aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="820" cy="107" r="51" fill="#6f52aa" stroke="none" stroke-width="2"/><text x="820" y="114" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="600" text-anchor="middle">查</text><text x="820" y="180" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle">只读查询</text><path d="M525,266 C660,266 650,252 762,252" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="820" cy="252" r="51" fill="#fffefa" stroke="none" stroke-width="2"/><text x="820" y="259" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="600" text-anchor="middle">问</text><text x="820" y="325" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle">澄清信息</text><path d="M525,266 C660,266 650,397 762,397" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="820" cy="397" r="51" fill="#fffefa" stroke="none" stroke-width="2"/><text x="820" y="404" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="600" text-anchor="middle">改</text><text x="820" y="470" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle">修改请求</text><text x="485" y="205" fill="#6f52aa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="middle">验证分类</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">分类范围、参数与权限由程序检查；含糊与未知都有自己的出口。</text></svg>
