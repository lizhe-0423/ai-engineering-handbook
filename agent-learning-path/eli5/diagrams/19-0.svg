<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="47" y="88" width="300" height="325" rx="3" fill="#e5e5dc" stroke="none" stroke-width="1.5" opacity="1"/><rect x="40" y="80" width="300" height="325" rx="3" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="40" y="80" width="5" height="325" rx="0" fill="#b44432" stroke="none" stroke-width="1.5" opacity="1"/><text x="62" y="119" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">已批准的操作</text><path d="M62,137 L318,137" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="171" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">接收人  甲</text><text x="62" y="206" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">草稿版本  v1</text><text x="62" y="241" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">操作  发送</text><text x="62" y="276" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">批准状态  有效</text><rect x="669" y="88" width="300" height="325" rx="3" fill="#e5e5dc" stroke="none" stroke-width="1.5" opacity="1"/><rect x="662" y="80" width="300" height="325" rx="3" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="662" y="80" width="5" height="325" rx="0" fill="#b44432" stroke="none" stroke-width="1.5" opacity="1"/><text x="684" y="119" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">准备执行的操作</text><path d="M684,137 L940,137" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="684" y="171" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">接收人  甲</text><text x="684" y="206" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">草稿版本  v1</text><text x="684" y="241" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">操作  发送</text><path d="M355,240 L443,240" fill="none" stroke="#287260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M558,240 L645,240" fill="none" stroke="#287260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="500" cy="240" r="56" fill="#287260" stroke="none" stroke-width="2"/><path d="M474,238 l18,20 l35,-39" fill="none" stroke="#fffefa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="333" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="650" text-anchor="middle">匹配并有效</text><text x="500" y="443" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle">执行前再次核对当前权限、内容和有效期</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">获准执行，只是发送的前提；业务成功还要等实际