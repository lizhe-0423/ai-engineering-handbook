<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">RAG 怎样从检索材料走到有依据的回答 · 有效材料</title><desc id="desc">经过权限与版本筛选，使用现行规则。答案里的结论能够对应到引用片段。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="52" y="78" width="405" height="355" rx="3" fill="#e5e5dc" stroke="none" stroke-width="1.5" opacity="1"/><rect x="45" y="70" width="405" height="355" rx="3" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="45" y="70" width="5" height="355" rx="0" fill="#287260" stroke="none" stroke-width="1.5" opacity="1"/><text x="67" y="109" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">检索材料 · 手册</text><path d="M67,127 L428,127" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="67" y="161" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">适用范围  员工请假</text><text x="67" y="196" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">版本  当前有效</text><rect x="67" y="237" width="360" height="60" rx="2" fill="#dfedd7" stroke="none" stroke-width="1.5" opacity="1"/><text x="82" y="275" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" text-anchor="start">本例规定提前三天申请</text><path d="M473,258 L552,258" fill="none" stroke="#287260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="515" y="227" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle">核对</text><rect x="582" y="112" width="375" height="282" rx="3" fill="#e5e5dc" stroke="none" stroke-width="1.5" opacity="1"/><rect x="575" y="104" width="375" height="282" rx="3" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="575" y="104" width="5" height="282" rx="0" fill="#287260" stroke="none" stroke-width="1.5" opacity="1"/><text x="597" y="143" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">准备给用户的回答</text><path d="M597,161 L928,161" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="597" y="195" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">请提前三天申请 [1]</text><text x="597" y="230" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start"></text><path d="M815,235 V405 H240 V318" fill="none" stroke="#287260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><text x="700" y="442" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="middle">[1] 真正支持这句话</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">示意规则为虚构例子。相关、现行、可访问、有依据，分别检查。</text></svg>
