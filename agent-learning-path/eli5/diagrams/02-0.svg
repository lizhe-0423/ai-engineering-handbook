<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">提示词怎样成为可检查的任务要求 · 含糊要求</title><desc id="desc">“整理一下”没有规定交付形式。模型生成一段摘要，也可能符合这句话，却不满足待办提取需求。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="67" y="53" width="535" height="395" rx="3" fill="#e5e5dc" stroke="none" stroke-width="1.5" opacity="1"/><rect x="60" y="45" width="535" height="395" rx="3" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><rect x="60" y="45" width="5" height="395" rx="0" fill="#2858ce" stroke="none" stroke-width="1.5" opacity="1"/><text x="82" y="84" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">任务说明</text><path d="M82,102 L573,102" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="160" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start">任务</text><text x="180" y="160" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="550" text-anchor="start">整理一下</text><path d="M90,183 L560,183" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="230" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start">材料</text><text x="180" y="230" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="550" text-anchor="start">会议记录的原文</text><path d="M90,253 L560,253" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="300" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start">输出</text><text x="180" y="300" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="550" text-anchor="start">未指定</text><path d="M90,323 L560,323" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="370" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start">缺失</text><text x="180" y="370" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="550" text-anchor="start">未约定</text><text x="675" y="105" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="650" text-anchor="start">验收清单</text><rect x="675" y="151" width="28" height="28" rx="3" fill="none" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><text x="720" y="175" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">能解析字段</text><rect x="675" y="231" width="28" height="28" rx="3" fill="none" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><text x="720" y="255" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">缺失保持未知</text><rect x="675" y="311" width="28" height="28" rx="3" fill="none" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><text x="720" y="335" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">结论回到材料</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">好要求能被检查；文本标签帮助分隔材料，不能代替权限边界。</text></svg>
