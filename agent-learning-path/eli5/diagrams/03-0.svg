<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Function Calling 怎样完成一次工具调用 · 提出调用</title><desc id="desc">模型选中 get_task_status，并给出 task_id。此时只有一份行动提议，数据库尚未被查询。</desc>
