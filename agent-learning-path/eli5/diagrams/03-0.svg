family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">模型只提出行动</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">模型提议 → 应用校验 → 工具执行 → 结果回填，各有自己的责任。</text></svg>
