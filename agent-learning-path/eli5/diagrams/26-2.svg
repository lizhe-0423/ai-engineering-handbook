<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">CLI Agent 怎样进入终端工作流 · 取消运行</title><desc id="desc">接收中断信号，停止新步骤、清理本地资源，再核对已发出的外部请求。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#18272e" stroke="none" stroke-width="1.5" opacity="1"/><circle cx="63" cy="43" r="7" fill="#d78978" stroke="none" stroke-width="2"/><circle cx="90" cy="43" r="7" fill="#ddbe78" stroke="none" stroke-width="2"/><circle cx="117" cy="43" r="7" fill="#80ab93" stroke="none" stroke-width="2"/><text x="955" y="50" fill="#acb9bb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="400" text-anchor="end">demo / 仅作教学</text><text x="54" y="132" fill="#b4d2ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="400" text-anchor="start">$ demo-agent</text><text x="54" y="196" fill="#f4f2e9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="400" text-anchor="start">执行工具中…</text><text x="54" y="260" fill="#edb39a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="400" text-anchor="start">^C</text><text x="54" y="324" fill="#f4f2e9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="400" text-anchor="start">停止新步骤，清理本地资源</text><text x="54" y="388" fill="#edb39a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="400" text-anchor="start">远端请求已发出，结果待核对</text><path d="M42,482 L958,482" fill="none" stroke="#405158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#acb9bb" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">示意命令不是可安装产品；交互入口与单次自动化有不同约定。</text></svg>
