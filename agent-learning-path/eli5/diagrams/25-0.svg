<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Hooks 怎样介入工具执行前后 · 执行前拦截</title><desc id="desc">before 钩子发现接收人不在允许范围，停止调用，业务处理器没有运行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><text x="50" y="67" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="650" text-anchor="start">一次真实执行的两侧</text><rect x="60" y="185" width="200" height="130" rx="6" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><text x="160" y="242" fill="#202b32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="650" text-anchor="middle">BEFORE</text><text x="160" y="285" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600" text-anchor="middle">执行前</text><rect x="400" y="185" width="200" height="130" rx="6" fill="#596b35" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><text x="500" y="242" fill="#fffefa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="650" text-anchor="middle">TOOL</text><text x="500" y="285" fill="#fffefa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600" text-anchor="middle">业务执行</text><rect x="740" y="185" width="200" height="130" rx="6" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><text x="840" y="242" fill="#202b32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="650" text-anchor="middle">AFTER</text><text x="840" y="285" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600" text-anchor="middle">执行后</text><path d="M270,250 L388,250" fill="none" stroke="#bc492e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M610,250 L728,250" fill="none" stroke="#d8dcd5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M316,222 L352,277 M352,222 L316,277" fill="none" stroke="#bc492e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="143" fill="#bc492e" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle">拦截不合法请求</text><text x="840" y="143" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle">审计与整理</text><text x="500" y="399" fill="#bc492e" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600" text-anchor="middle">拦住了，处理器不执行</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">顺序、超时与失败策略要明确；必要授权仍需在可信执行入口落实。</text></svg>
