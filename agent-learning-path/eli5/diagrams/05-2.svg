dth="5" height="250" rx="0" fill="#bc492e" stroke="none" stroke-width="1.5" opacity="1"/><text x="757" y="179" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start">MCP Server</text><path d="M757,197 L928,197" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="757" y="231" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">提供能力</text><text x="757" y="266" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">处理工具请求</text><text x="757" y="301" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">返回真实结果</text><path d="M437,300 L437,251" fill="none" stroke="#2858ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M554,334 L721,334" fill="none" stroke="#2858ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="644" y="312" fill="#2858ce" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="650" text-anchor="middle">tools/list</text><path d="M735,372 L566,372" fill="none" stroke="#287260" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="644" y="405" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle">工具定义</text><path d="M320,191 L285,191" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 8"/><text x="292" y="133" fill="#667273" font