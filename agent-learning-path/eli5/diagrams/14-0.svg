<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">子代理怎样接受委派并返回结果 · 全新上下文</title><desc id="desc">子代理只拿明确子任务、必要材料和权限范围。适合独立查询，减少无关历史。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="540" rx="0" fill="#f6f3eb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="52" y="61" width="340" height="369" rx="6" fill="#e9e4ee" stroke="none" stroke-width="1.5" opacity="1"/><text x="78" y="107" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="650" text-anchor="start">主任务上下文</text><rect x="78" y="133" width="286" height="49" rx="3" fill="#fffefa" stroke="none" stroke-width="1.5" opacity="1"/><text x="97" y="166" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">用户目标</text><rect x="78" y="199" width="286" height="49" rx="3" fill="#fffefa" stroke="none" stroke-width="1.5" opacity="1"/><text x="97" y="232" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">长期对话</text><rect x="78" y="265" width="286" height="49" rx="3" fill="#fffefa" stroke="none" stroke-width="1.5" opacity="1"/><text x="97" y="298" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">其他资料</text><rect x="78" y="331" width="286" height="49" rx="3" fill="#fffefa" stroke="none" stroke-width="1.5" opacity="1"/><text x="97" y="364" fill="#6f52aa" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">本次子任务</text><path d="M392,356 H502 V160 H604" fill="none" stroke="#6f52aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="620" y="86" width="330" height="266" rx="6" fill="#fffefa" stroke="#d8dcd5" stroke-width="1.5" opacity="1"/><text x="644" y="130" fill="#202b32" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="650" text-anchor="start">子代理的任务包</text><text x="644" y="187" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">只核对三项任务</text><text x="644" y="236" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">来源与检查规则</text><text x="644" y="285" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">不带无关历史</text><path d="M785,363 V420 H408" fill="none" stroke="#287260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="620" y="451" fill="#287260" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="middle">结果 + 来源 + 未解决项</text><path d="M42,482 L958,482" fill="none" stroke="#d8dcd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="516" fill="#667273" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">传递必要背景，限定权限与预算；主代理负责接收和检查返回结果。</text></svg>
